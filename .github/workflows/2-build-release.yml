name: "2. Build & Release OpenXDR (English Edition)"

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (ဥပမာ v2026.11.02-openxdr-en)'
        required: false
  push:
    tags:
      - 'v*-en'
      - 'v*-openxdr-en'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: "Build OpenXDR Binaries & Publish Release"
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout Translated Source"
        uses: actions/checkout@v4
        with:
          ref: 'english-edition'

      - name: "2. Setup Golang 1.23"
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: "3. Build OpenXDR Server (Go)"
        run: |
          mkdir -p release-assets
          if [ -d "server" ] && [ -f "server/go.mod" ]; then
            echo "Building Go Server..."
            cd server
            go mod tidy || true
            GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../release-assets/openxdr-server-linux-amd64" . || true
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../release-assets/openxdr-server-windows-amd64.exe" . || true
            GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "../release-assets/openxdr-server-darwin-arm64" . || true
            cd ..
          fi

      - name: "4. Setup Rust & Cross-Compilation Tools"
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
          rustup toolchain install nightly --component rust-src
          cargo install bpf-linker --version 0.10.4 --locked || true

      - name: "5. Build OpenXDR Agent & Sensor (Rust)"
        run: |
          echo "Building Rust Agent..."
          if [ -d "agent" ]; then
            cd agent
            cargo build --release --locked --features ebpf --target x86_64-unknown-linux-musl || cargo build --release --locked --target x86_64-unknown-linux-musl
            cargo build --release --locked --target x86_64-pc-windows-gnu || true
            cd ..
            cp agent/target/x86_64-unknown-linux-musl/release/openxdr-agent release-assets/openxdr-agent-linux-amd64 || true
            cp agent/target/x86_64-pc-windows-gnu/release/openxdr-agent.exe release-assets/openxdr-agent-windows-amd64.exe || true
          fi

          echo "Building Rust Sensor..."
          if [ -d "sensor" ]; then
            cd sensor
            cargo build --release --locked --target x86_64-unknown-linux-musl || true
            cd ..
            cp sensor/target/x86_64-unknown-linux-musl/release/openxdr-sensor release-assets/openxdr-sensor-linux-amd64 || true
          fi

      - name: "6. Prepare install.sh and Configs"
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          
          # install.sh ကိုထုတ်ယူပြီး လိုအပ်သည်များ အစားထိုးခြင်း
          if [ -f "deploy/install/install.sh" ]; then
            sed "s/__OPENXDR_VERSION__/$TAG/g" deploy/install/install.sh > release-assets/install.sh
            # yaklang Repo နေရာတွင် professoxrmoriarty သို့ ပြောင်းလဲခြင်း
            sed -i 's/github.com\/yaklang/github.com\/professoxrmoriarty/g' release-assets/install.sh
            sed -i 's/ghcr.io\/yaklang/ghcr.io\/professoxrmoriarty/g' release-assets/install.sh
            chmod +x release-assets/install.sh
          fi
          
          # docker-compose.yml များကို ထည့်သွင်းခြင်း
          if [ -f "deploy/install/docker-compose.yml" ]; then
            cp deploy/install/docker-compose.yml release-assets/
            sed -i 's/ghcr.io\/yaklang/ghcr.io\/professoxrmoriarty/g' release-assets/docker-compose.yml || true
          fi
          if [ -f "deploy/nats.conf" ]; then
            cp deploy/nats.conf release-assets/
          fi

          # Source Code ကို Zip ထုတ်ခြင်း
          zip -r "release-assets/OpenXDR-source-en.zip" . -x "*.git*" "release-assets/*"
          
          # SHA256SUMS တွက်ချက်ခြင်း (မူရင်းအတိုင်း)
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..

      - name: "7. Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "OpenXDR ${{ inputs.tag_name || github.ref_name }}"
          overwrite: true
          body: |
            ### Install
            
            One-line install on a Linux server with Docker (x86_64 or arm64, recommended 2 cores & 4GB RAM or above):
            
            ```bash
            curl -fsSL [https://github.com/professoxrmoriarty/OpenXDR/releases/download/$](https://github.com/professoxrmoriarty/OpenXDR/releases/download/$){{ inputs.tag_name || github.ref_name }}/install.sh | sudo sh -s -- <console-domain-or-IP>
            ```
            
            The script will generate passwords and keys, issue mTLS certificates, configure HTTPS (automatically applies for Let's Encrypt for public domains, uses built-in CA for private IPs), and print the console URL and admin password upon completion. Once installed, you can add monitored hosts via "Assets -> Add Host". Running the script again on an installed server will upgrade it.
            
            **Or ask your AI agent to install (Claude Code, Codex, Cursor, etc., running on the target server):**
            
            ```text
            Install OpenXDR ${{ inputs.tag_name || github.ref_name }} on this server strictly following [https://github.com/professoxrmoriarty/OpenXDR/blob/master/docs/install.md](https://github.com/professoxrmoriarty/OpenXDR/blob/master/docs/install.md) :
            check the environment, ask me which domain or IP to use for the console, run the installer, then tell me the console URL, the admin password, and how managed hosts should trust the CA.
            ```
            
            ---
            
            ### Assets Description
            
            | Asset | Description |
            | :--- | :--- |
            | `install.sh` / `docker-compose.yml` | One-line installation script and its orchestration file |
            | `openxdr-agent-linux-amd64` | Endpoint agent, statically linked with eBPF, universal for old and new distros (automatically deployed by the console, usually no need to download manually) |
            | `openxdr-agent-linux-arm64` | Same as above, for arm64 (ARM cloud hosts, Raspberry Pi, etc.) |
            | `openxdr-agent-windows-amd64.exe` | Windows endpoint agent |
            | `openxdr-sensor-linux-amd64/arm64` | Full traffic probe / sensor |
            | `SHA256SUMS` | Checksums |
            
            **Images:** `ghcr.io/professoxrmoriarty/openxdr-server:${{ inputs.tag_name || github.ref_name }}` and `ghcr.io/professoxrmoriarty/openxdr-web:${{ inputs.tag_name || github.ref_name }}` (amd64/arm64). The server image has built-in default rules, scheduled tasks, and agent installation packages.
            
          draft: false
          prerelease: false
          files: release-assets/*
